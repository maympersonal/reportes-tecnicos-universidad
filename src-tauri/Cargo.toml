[package]
name = "reportes-tecnicos"
version = "1.0.0"
description = "Sistema de Reportes Técnicos - Dirección de Innovación Digital"
authors = ["Dirección de Innovación Digital <innovacion.did@iris.uh.cu>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "reportes_tecnicos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# By default Tauri runs in production mode.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
